# Stubble Burn-Area Audit: single source of configuration.
# All paths are relative to the directory containing this file.

project:
  name: stubble-audit
  district_code: SGR            # prefix for synthetic IDs (SGR-0001, SGR-G-001)

aoi:
  source: osm                   # osm | bbox
  # OpenStreetMap relation for Sangrur district (post-2021, excludes Malerkotla).
  # Data (c) OpenStreetMap contributors, ODbL 1.0.
  osm_relation_id: 9513553
  # Used only if the boundary cannot be downloaded (and recorded in provenance).
  fallback_bbox: {lat: 30.24, lon: 75.84, buffer_km: 25}
  crs: EPSG:32643               # WGS 84 / UTM 43N
  resolution_m: 10
  context_buffer_m: 500         # raster extent = AOI bounds + buffer (for chip context)
  grid_km: 5                    # analysis grid for FIRMS comparison
  # Optional debug subset: [minx, miny, maxx, maxy] in EPSG:4326 to restrict the raster extent.
  subset_bbox: null

season:
  start: 2025-10-01
  end: 2025-11-30

windows:
  pre:  {start: 2025-09-20, end: 2025-10-05}
  post: {start: 2025-10-06, end: 2025-11-30, step_days: 7}

provider: planetary              # planetary | gee (gee not implemented yet)

sentinel2:
  collection: sentinel-2-l2a
  # B4, B8, B8A, B11, B12 are the analysis bands. B2, B3 are only for true-colour display chips.
  bands: [B02, B03, B04, B08, B8A, B11, B12]
  scl_band: SCL
  # SCL classes treated as invalid: 0 no data, 1 saturated/defective, 3 cloud shadow,
  # 8 cloud medium prob, 9 cloud high prob, 10 thin cirrus.
  # Class 2 ("dark area pixels") is deliberately KEPT: fresh burn scars are dark and
  # are frequently assigned to class 2.
  scl_invalid: [0, 1, 3, 8, 9, 10]
  max_scene_cloud_pct: 90        # item-level prefilter only; pixel masking does the real work
  reflectance_scale: 10000       # stored int16 = reflectance * scale
  boa_offset: -1000              # applied for processing baseline >= 04.00

sentinel1:
  collection: sentinel-1-rtc
  bands: [vv, vh]
  orbit_state: any               # any | ascending | descending
  db_scale: 100                  # stored int16 = dB * scale

detection:                       # M2 baseline (per-pixel time series, not weekly composites)
  dnbr_threshold: 0.27           # burnt if NBR_pre - NBR_obs > threshold
  opening_radius_px: 1           # morphological opening, (2r+1) x (2r+1) square
  min_patch_ha: 0.1              # minimum polygon area after cleaning
  connectivity: 8                # pixel connectivity for patches
  confirm_days: 10               # look-ahead for supporting post-burn observations
  same_day_merge: mean           # how two S2 passes on one day are merged (clear obs only)

quality:
  haze_blue_threshold: 0.15      # clear-by-SCL obs with B02 reflectance above this = hazy
  haze_cloud_classes: [8, 9, 10] # obs within haze_cloud_buffer_m of these = hazy
  haze_cloud_buffer_m: 300
  wide_window_days: 10           # burn-date window wider than this gets a quality flag

haze_mask:                       # M2.1 only (M2 keeps `quality`); set a priori, not tuned
  # Sen2Cor aerosol optical thickness at 550 nm (L2A AOT asset, stored x1000). A clear-by-SCL
  # view with AOT above this is hazy/smoky and skipped (ORed with the blue and cloud tests).
  haze_aot_threshold: 0.6
  # s2cloudless is not used: it needs L1C top-of-atmosphere bands incl. B10, which the
  # Planetary Computer L2A collection does not carry (not cheap: a second product download).
  # Scene exclusion rule (decided before the run): after haze masking a scene is dropped
  # entirely if fewer than this share of its SCL-clear AOI pixels remain usable ...
  scene_min_usable_frac: 0.2
  # ... or if its pseudo-invariant-pixel residual spread (after offset removal, any analysis
  # band) exceeds this multiple of the median spread across scenes.
  scene_max_pif_spread_factor: 3.0
  exclude_days: []               # manual exclusions (YYYY-MM-DD), applied on top of the rule

harvest_detection:               # M2.1: per-pixel harvest date from NDVI
  ndvi_green: 0.6                # a clear view above this counts as "green" (standing crop)
  min_green_views: 1             # green views required before a harvest can be detected
  ndvi_harvest: 0.3              # harvest = first clear view below this after the green period

burn_detection:                  # M2.1: burns only between consecutive clear views after harvest
  dnbr_short_min: 0.10           # NBR(prev) - NBR(cur) must exceed this
  albedo_rel_drop_min: 0.15      # (alb_prev - alb_cur) / alb_prev, alb = mean(B02,B03,B04,B08)
  dnbr2_min: 0.02                # NBR2(prev) - NBR2(cur), NBR2 = (B11-B12)/(B11+B12)
  use_hazy_views: false          # hazy views are skipped (they widen windows, never trigger)
  confirm_days: 10               # look-ahead for views that keep the burn signal
  opening_radius_px: 1
  min_patch_ha: 0.1
  connectivity: 8
  # Early burns: a pixel whose first post-harvest view (straight after a green view) already
  # has a strong absolute char signature is labelled harvest_and_burn_same_window; otherwise
  # the interval before that view stays unobserved for burning. "Strong" = darker than 75 %
  # of the frozen M2.1 consecutive-view burns (p25 of their post-burn NBR and albedo).
  char_nbr_max: -0.24
  char_albedo_max: 0.09

radiometry:                      # M2.1 relative radiometric normalisation (per acquisition)
  # Pseudo-invariant pixels: ESA WorldCover 2021 v200 built-up (50) and bare/sparse (60),
  # eroded by erode_px, never green (season NDVI max below pif_ndvi_max) and stable
  # (robust spread (p84-p16)/2 / median of every analysis band below pif_max_rel_spread).
  worldcover_classes: [50, 60]
  erode_px: 1
  pif_ndvi_max: 0.3
  pif_max_rel_spread: 0.15
  pif_min_views: 8               # usable views needed to judge stability
  sample_px: 200000              # random candidate pixels kept (seeded) for the statistics
  min_pif_px: 500                # fewer usable PIFs on a date -> no offset, flagged
  seed: 20251001
  bands: [B02, B03, B04, B08, B11, B12]

s1_support:                      # Sentinel-1 is supporting evidence only (never flags alone)
  min_valid_frac: 0.5            # polygon pixels with valid backscatter for a usable acq

paths:
  raw: data/raw
  cache: data/cache
  processed: data/processed
  labels: data/labels
  outputs: data/outputs
  reports: reports

io:
  block_rows: 512                # rows per block when compositing
  download_chunk: 2048           # dask chunk size for remote reads
  max_retries: 3

labelling:                       # M3: stratified sample + labelling tool
  n_total: 400
  flagged_frac: 0.8              # share drawn from M2.1 candidate polygons
  n_score_bins: 5                # equal-count (quantile) bins of detection_score
  extra_weeks: {w04: 2.0}        # week weights (default 1); w04 gets double allocation
  unflagged_unit_px: 10          # unflagged cropland units = 100 m x 100 m grid cells ...
  unflagged_min_frac: 0.9        # ... with at least this share unflagged-cropland pixels
  seed: 20251118
  classes: [burnt, not_burnt, unsure]   # keys 1 / 2 / 3
  # Earlier 5-class labels stay valid in the store and are folded into the 3 classes.
  legacy_classes: {tilled_not_burnt: not_burnt, harvested_not_burnt: not_burnt, wet: not_burnt}
  # Blind display (same for every item): window of chip_window_px x chip_window_px pixels
  # (odd; 31 px = 310 m) centred on the pixel containing representative_point(), crosshair at
  # its centre, neutral crosshair_box_m square around it, no geometry outline.
  chip_window_px: 31
  crosshair_box_m: 100
  tile_upscale: 4                # tiles drawn x4, nearest neighbour (31 px -> 124 px)
  stretch_percentiles: [2, 98]   # one per-band stretch per item, from all its clear pixels/dates
  dnbr_display_max: 0.4          # ΔNBR row colour scale, -max..+max, same for every item
  series_window_px: 3            # chart = mean of the clear pixels in this square at the crosshair
  # Time strip: a view is shown when the date is not scene-excluded, the polygon is at least
  # strip_min_coverage covered by data and at least strip_min_clear_frac of it is SCL-clear and
  # not haze-masked (same blue / cloud-buffer / AOT tests as the M2.1 detector).
  strip_min_clear_frac: 0.5
  strip_min_coverage: 0.5
  strip_cols: 8                  # dates per strip row
  # Blind queue: order shuffled with queue_seed; n_repeats items are shown a second time,
  # unmarked, at least repeat_min_gap items after their first showing (labeller consistency).
  # Only the first n_label items of that shuffled order are labelled (a seeded simple random
  # half of the stratified sample; strata are re-weighted on export).
  queue_seed: 20251119
  n_label: 200
  n_repeats: 20
  repeat_min_gap: 40
  # Hidden repeats are shown WITHOUT the chart and ΔNBR row (true colour + SWIR only), so the
  # repeat pairs measure chart-on vs chart-off agreement (how far the aids pull labels toward
  # the M2.1 rule features). Still unmarked; first showings always have the aids.
  repeat_show_aids: false
  # Speed bump: label keys are disabled for this many seconds after an item appears.
  min_view_seconds: 4
  # Review round (stubble review-select / label --review / review-report): every current label
  # saved <= review_fast_gap_s after the previous save, plus review_n_control random slower
  # labels as a control, mixed in one seeded order (review_seed); nothing marks the group.
  review_round: r1
  review_fast_gap_s: 2
  review_n_control: 20
  review_seed: 20251120
